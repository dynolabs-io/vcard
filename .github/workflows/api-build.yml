name: api-build-and-push

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/api-build.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - vcard-api
          - pass-signer
          - photo-cdn
          - linkedin-oauth
          - web-profile
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./api
          file: api/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/dynolabs-io/vcard/api/${{ matrix.service }}:${{ steps.sha.outputs.short }}
            ghcr.io/dynolabs-io/vcard/api/${{ matrix.service }}:latest
          build-args: |
            VERSION=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
