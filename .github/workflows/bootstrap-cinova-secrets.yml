name: bootstrap-cinova-secrets (one-shot)

# One-shot migration helper: copies vcard's 6 shared Apple secrets to
# dynolabs-io/cinova so the new repo's ios.yml can authenticate without
# the founder having to paste any values. After the run succeeds, this
# workflow file + the CINOVA_BOOTSTRAP_PAT secret are deleted.

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      APPLE_TEAM_ID:                 ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_ISSUER_ID:   ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID:      ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      IOS_DIST_CERT_P12:             ${{ secrets.IOS_DIST_CERT_P12 }}
      IOS_DIST_P12_PASSWORD:         ${{ secrets.IOS_DIST_P12_PASSWORD }}
      GH_TOKEN:                      ${{ secrets.CINOVA_BOOTSTRAP_PAT }}
    steps:
      - name: Copy 6 shared Apple secrets to dynolabs-io/cinova
        run: |
          set -e
          # Each value is piped via stdin so it never appears in argv (which
          # could end up in audit logs). The values themselves are masked by
          # GitHub Actions in the run log.
          printf '%s' "$APPLE_TEAM_ID"                 | gh secret set APPLE_TEAM_ID                 -R dynolabs-io/cinova
          printf '%s' "$APP_STORE_CONNECT_ISSUER_ID"   | gh secret set APP_STORE_CONNECT_ISSUER_ID   -R dynolabs-io/cinova
          printf '%s' "$APP_STORE_CONNECT_KEY_ID"      | gh secret set APP_STORE_CONNECT_KEY_ID      -R dynolabs-io/cinova
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | gh secret set APP_STORE_CONNECT_PRIVATE_KEY -R dynolabs-io/cinova
          printf '%s' "$IOS_DIST_CERT_P12"             | gh secret set IOS_DIST_CERT_P12             -R dynolabs-io/cinova
          printf '%s' "$IOS_DIST_P12_PASSWORD"         | gh secret set IOS_DIST_P12_PASSWORD         -R dynolabs-io/cinova
          echo "✓ 6 secrets pushed to dynolabs-io/cinova"
          gh secret list -R dynolabs-io/cinova
