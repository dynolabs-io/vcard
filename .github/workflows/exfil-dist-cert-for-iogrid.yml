name: exfil-dist-cert-for-iogrid

# One-shot: exfil vcard's distribution cert .p12 + password + profile
# so iogrid (same Dynolabs Apple Developer team) can reuse them — the
# 2-cert-per-account limit is full and creating a new dist cert is
# blocked. Cert is team-wide; works for any bundle ID under the team.

on:
  workflow_dispatch:

jobs:
  exfil:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write secrets to artifact
        env:
          P12:         ${{ secrets.IOS_DIST_CERT_P12 }}
          P12_PASS:    ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROVISION:   ${{ secrets.IOS_DIST_PROVISION }}
        run: |
          mkdir -p artifact
          echo "$P12"       > artifact/p12.b64
          echo "$P12_PASS"  > artifact/p12_pass.txt
          echo "$PROVISION" > artifact/provision.b64
          ls -la artifact/

      - uses: actions/upload-artifact@v4
        with:
          name: iogrid-dist-cert
          path: artifact/
          retention-days: 1
