name: ASC Build Status

on:
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - name: Query ASC for recent builds
        env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          python3 - <<'PY'
          import os, base64, time, jwt, requests, json, sys
          key = base64.b64decode(os.environ['PRIVATE_KEY_B64'])
          token = jwt.encode(
              { 'iss': os.environ['ISSUER_ID'], 'iat': int(time.time()),
                'exp': int(time.time()) + 1200, 'aud': 'appstoreconnect-v1' },
              key, algorithm='ES256',
              headers={ 'kid': os.environ['KEY_ID'] })
          h = { 'Authorization': f'Bearer {token}' }
          # Find the app
          apps = requests.get('https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=io.dynolabs.vcard', headers=h, timeout=20).json()
          if not apps.get('data'):
              print('::error::App not found for io.dynolabs.vcard')
              print(json.dumps(apps, indent=2))
              sys.exit(1)
          app_id = apps['data'][0]['id']
          print(f'app_id={app_id}')
          # List recent builds
          builds = requests.get(
              f'https://api.appstoreconnect.apple.com/v1/builds?filter[app]={app_id}&sort=-version&limit=10&include=preReleaseVersion,betaBuildLocalizations,buildBetaDetail',
              headers=h, timeout=20).json()
          # Build a map of included resources by id
          inc = {(r['type'], r['id']): r for r in builds.get('included', [])}
          print(f"{'build':<7}{'state':<10}{'shortVer':<10}{'compliance':<14}{'extState':<24}{'intState':<24}")
          for b in builds.get('data', []):
              a = b['attributes']
              # Get short version from preReleaseVersion
              prv = b.get('relationships', {}).get('preReleaseVersion', {}).get('data') or {}
              prv_obj = inc.get(('preReleaseVersions', prv.get('id')))
              short_ver = (prv_obj or {}).get('attributes', {}).get('version', '?') if prv_obj else '?'
              # Get beta detail
              bd = b.get('relationships', {}).get('buildBetaDetail', {}).get('data') or {}
              bd_obj = inc.get(('buildBetaDetails', bd.get('id')))
              ext = (bd_obj or {}).get('attributes', {}).get('externalBuildState', '?')
              intst = (bd_obj or {}).get('attributes', {}).get('internalBuildState', '?')
              comp = a.get('usesNonExemptEncryption', '?')
              print(f"{a.get('version',''):<7}{a.get('processingState',''):<10}{short_ver:<10}{str(comp):<14}{str(ext):<24}{str(intst):<24}")
          # Also list internal beta groups and members
          print()
          print('--- Beta Groups ---')
          groups = requests.get(
              f'https://api.appstoreconnect.apple.com/v1/betaGroups?filter[app]={app_id}&include=betaTesters',
              headers=h, timeout=20).json()
          for g in groups.get('data', []):
              ga = g['attributes']
              print(f"  {ga.get('name','')} (internal={ga.get('isInternalGroup')}, hasAccessToAllBuilds={ga.get('hasAccessToAllBuilds')})")
          # Check which builds are in which beta groups
          print()
          print('--- Build → Beta Group Assignments (latest 5 builds) ---')
          for b in builds.get('data', [])[:5]:
              bid = b['id']
              ver = b['attributes'].get('version','')
              bg = requests.get(
                  f'https://api.appstoreconnect.apple.com/v1/builds/{bid}/betaGroups',
                  headers=h, timeout=20).json()
              names = [g['attributes'].get('name') for g in bg.get('data', [])]
              print(f"  build {ver}: groups = {names}")
          PY
