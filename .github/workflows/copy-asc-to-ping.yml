# One-off: copy APP_STORE_CONNECT_* + APPLE_TEAM_ID from this repo's
# GHA secrets to ping-cash/ping-cash. GHA secrets are read-only via REST API
# but available as env vars inside the running workflow — so we read them
# here and PUT them encrypted into ping-cash via the GitHub REST API
# using a cross-repo PAT.
#
# DELETE THIS WORKFLOW after the secrets are propagated.

name: copy-asc-to-ping
on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy ASC secrets to ping-cash/ping-cash
        env:
          DEST_REPO: ping-cash/ping-cash
          PAT: ${{ secrets.CROSS_REPO_PAT_PING }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pip install pynacl requests
          python3 <<'PYEOF'
          import os, json, base64
          import requests
          from nacl import encoding, public

          dest = os.environ['DEST_REPO']
          pat = os.environ['PAT']
          headers = { 'Authorization': f'token {pat}', 'Accept': 'application/vnd.github+json' }

          # Fetch ping-cash repo public key
          r = requests.get(f'https://api.github.com/repos/{dest}/actions/secrets/public-key', headers=headers)
          r.raise_for_status()
          pk = r.json()
          pub = public.PublicKey(pk['key'].encode('utf-8'), encoding.Base64Encoder())
          sb = public.SealedBox(pub)
          kid = pk['key_id']

          to_copy = {
            'APP_STORE_CONNECT_KEY_ID':     os.environ['ASC_KEY_ID'],
            'APP_STORE_CONNECT_ISSUER_ID':  os.environ['ASC_ISSUER_ID'],
            'APP_STORE_CONNECT_PRIVATE_KEY': os.environ['ASC_PRIVATE_KEY'],
            'APPLE_TEAM_ID':                os.environ['APPLE_TEAM_ID'],
          }
          for name, value in to_copy.items():
              if not value:
                  print(f'  SKIP {name} (empty in source)')
                  continue
              enc = base64.b64encode(sb.encrypt(value.encode('utf-8'))).decode()
              rr = requests.put(
                  f'https://api.github.com/repos/{dest}/actions/secrets/{name}',
                  headers=headers,
                  json={ 'encrypted_value': enc, 'key_id': kid })
              print(f'  PUT {name} -> {dest}: {rr.status_code}')
              rr.raise_for_status()
          print('DONE')
          PYEOF
