name: ASC Assign Build to Founders

on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'CFBundleVersion to assign (e.g. 50)'
        required: true
        default: '50'
      tester_email:
        description: 'Email to invite as individual tester'
        required: true
        default: 'alierenbaysal@gmail.com'

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyjwt cryptography requests
      - name: Toggle Founders to all-builds + assign requested build
        env:
          KEY_ID:    ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          PRIVATE_KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BUILD_VERSION: ${{ inputs.build_version }}
          TESTER_EMAIL: ${{ inputs.tester_email }}
        run: |
          python3 - <<'PY'
          import os, base64, time, jwt, requests, json, sys
          key = base64.b64decode(os.environ['PRIVATE_KEY_B64'])
          token = jwt.encode(
              { 'iss': os.environ['ISSUER_ID'], 'iat': int(time.time()),
                'exp': int(time.time()) + 1200, 'aud': 'appstoreconnect-v1' },
              key, algorithm='ES256', headers={ 'kid': os.environ['KEY_ID'] })
          h = { 'Authorization': f'Bearer {token}' }
          base = 'https://api.appstoreconnect.apple.com'

          # 1. Find the app
          apps = requests.get(f'{base}/v1/apps?filter[bundleId]=io.dynolabs.vcard', headers=h, timeout=20).json()
          app_id = apps['data'][0]['id']
          print(f'app_id={app_id}')

          # 2. Find the Founders group
          groups = requests.get(f'{base}/v1/betaGroups?filter[app]={app_id}', headers=h, timeout=20).json()
          founders = next((g for g in groups['data'] if g['attributes']['name'] == 'Founders'), None)
          if not founders:
              print('::error::Founders beta group not found'); sys.exit(1)
          group_id = founders['id']
          print(f'group_id={group_id}  hasAccessToAllBuilds={founders["attributes"]["hasAccessToAllBuilds"]}')

          # 3. Flip Founders to hasAccessToAllBuilds=True (futureproof for future uploads)
          patch_body = { 'data': { 'type': 'betaGroups', 'id': group_id,
              'attributes': { 'hasAccessToAllBuilds': True } } }
          r = requests.patch(f'{base}/v1/betaGroups/{group_id}',
              headers={**h, 'Content-Type': 'application/json'},
              data=json.dumps(patch_body), timeout=20)
          print(f'patch status={r.status_code}')
          if r.status_code >= 300:
              print(r.text)

          # 4. Find the requested build (by version)
          ver = os.environ['BUILD_VERSION']
          builds = requests.get(f'{base}/v1/builds?filter[app]={app_id}&filter[version]={ver}&limit=1',
              headers=h, timeout=20).json()
          if not builds.get('data'):
              print(f'::error::No build with version {ver}'); sys.exit(1)
          build_id = builds['data'][0]['id']
          print(f'build_id={build_id}')

          # 5. Inspect buildBetaDetail (export compliance, beta state)
          bd = requests.get(f'{base}/v1/builds/{build_id}/buildBetaDetail', headers=h, timeout=20).json()
          print('buildBetaDetail:', json.dumps(bd, indent=2)[:1200])

          # 6. Try assigning from BOTH directions — use the group's relationship endpoint
          # which is the documented forward direction.
          rel = { 'data': [ { 'type': 'builds', 'id': build_id } ] }
          r = requests.post(f'{base}/v1/betaGroups/{group_id}/relationships/builds',
              headers={**h, 'Content-Type': 'application/json'},
              data=json.dumps(rel), timeout=20)
          print(f'group→build assign status={r.status_code}')
          if r.status_code >= 300:
              print('  body:', r.text)

          # 7. List all internal beta groups for this app (there may be an auto
          # "App Store Connect Users" group separate from the Founders one)
          all_groups = requests.get(f'{base}/v1/betaGroups?filter[app]={app_id}', headers=h, timeout=20).json()
          print()
          print('All beta groups:')
          for g in all_groups.get('data', []):
              ga = g['attributes']
              print(f"  {ga.get('name')} id={g['id']} internal={ga.get('isInternalGroup')} hasAll={ga.get('hasAccessToAllBuilds')}")

          # 8. Verify assignment landed (with eventual-consistency retry)
          for attempt in range(3):
              time.sleep(2)
              bg = requests.get(f'{base}/v1/builds/{build_id}/betaGroups', headers=h, timeout=20).json()
              names = [g['attributes'].get('name') for g in bg.get('data', [])]
              print(f'  attempt {attempt+1}: build {ver} groups = {names}')
              if names: break

          # 9. List ASC users (account members — they get internal builds automatically
          # IF they have the right role)
          print()
          print('=== App Store Connect users on the account ===')
          users = requests.get(f'{base}/v1/users?limit=50&fields[users]=username,roles,allAppsVisible',
              headers=h, timeout=20).json()
          for u in users.get('data', []):
              ua = u['attributes']
              print(f"  {ua.get('username')} roles={ua.get('roles')} allAppsVisible={ua.get('allAppsVisible')}")

          # 10. Invite the requested email as an individual beta tester for this app
          email = os.environ['TESTER_EMAIL']
          # Check if already exists
          existing = requests.get(f'{base}/v1/betaTesters?filter[email]={email}', headers=h, timeout=20).json()
          if existing.get('data'):
              tester_id = existing['data'][0]['id']
              print(f'tester {email} already exists: id={tester_id}')
          else:
              # Apple requires the create relationship to be betaGroups (not apps).
              # Adding to Founders group gives them app access transitively.
              create_body = {
                  'data': {
                      'type': 'betaTesters',
                      'attributes': { 'email': email, 'firstName': 'Ali', 'lastName': 'Baysal' },
                      'relationships': {
                          'betaGroups': { 'data': [ { 'type': 'betaGroups', 'id': group_id } ] },
                      },
                  }
              }
              r = requests.post(f'{base}/v1/betaTesters',
                  headers={**h, 'Content-Type': 'application/json'},
                  data=json.dumps(create_body), timeout=20)
              print(f'create-tester status={r.status_code}')
              if r.status_code >= 300:
                  print('  body:', r.text)
              tester_id = r.json().get('data', {}).get('id') if r.status_code < 300 else None

          # 11. Assign tester to Founders group
          if tester_id:
              rel = { 'data': [ { 'type': 'betaTesters', 'id': tester_id } ] }
              r = requests.post(f'{base}/v1/betaGroups/{group_id}/relationships/betaTesters',
                  headers={**h, 'Content-Type': 'application/json'},
                  data=json.dumps(rel), timeout=20)
              print(f'add-tester-to-group status={r.status_code}')
              if r.status_code >= 300: print('  body:', r.text)

              # 12. Assign tester individually to build 50 (parallel path)
              rel = { 'data': [ { 'type': 'builds', 'id': build_id } ] }
              r = requests.post(f'{base}/v1/betaTesters/{tester_id}/relationships/builds',
                  headers={**h, 'Content-Type': 'application/json'},
                  data=json.dumps(rel), timeout=20)
              print(f'assign-tester-to-build status={r.status_code}')
              if r.status_code >= 300: print('  body:', r.text)
          PY
