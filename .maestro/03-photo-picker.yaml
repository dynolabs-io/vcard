appId: io.dynolabs.vcard
---
# Photo picker. Only verifies the dialog OPENS — does not interact with
# iOS PHPicker because the iOS 26 sim leaves the edit form in a blank
# state after PHPicker dismisses (sim bug, not an app bug).
# Real-device verification via /v1/crash trace logs of pickPhoto.*.
- launchApp:
    stopApp: false
- tapOn: "Maestro Tester"
# Edit lives in the navigation header right (Apple Contacts style),
# no scroll needed.
- tapOn: "Edit"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn: "Add photo"
- assertVisible: "Profile photo"
- assertNotVisible: "Photo failed"
# Cancel the alert (NOT the PHPicker) so the form stays mounted.
- tapOn: "Cancel"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element: "Save changes"
    direction: DOWN
- tapOn: "Save changes"
- runFlow:
    when:
      notVisible: "Cards"
    commands:
      - tapOn: "Cards"
- assertVisible: "Your cards"
