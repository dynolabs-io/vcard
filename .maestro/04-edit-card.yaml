appId: io.dynolabs.vcard
---
# Edit card + persist after kill. We're already on the edit form (from
# flow 03 photo-picker which left us here). Change the name, save,
# kill, relaunch, assert.
- launchApp:
    stopApp: false
- assertVisible: "Your cards"
- tapOn: "Maestro Tester"
- scrollUntilVisible:
    element: "Edit"
    direction: DOWN
- tapOn: "Edit"
- assertVisible: "Edit Card"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Maestro Tester"
- eraseText: 14
- inputText: "Maestro Edited"
- swipe:
    direction: DOWN
- scrollUntilVisible:
    element: "Save changes"
    direction: DOWN
- tapOn: "Save changes"
- assertVisible: "Maestro Edited"
# Save returns to card detail page. Navigate back to cards list. The
# back button's accessibility label is 'Back' (set via headerBackTitle
# in app/_layout.tsx). iOS has no hardware back so Maestro's `back`
# command is a no-op.
- tapOn: "Back"
- assertVisible: "Your cards"
- assertVisible: "Maestro Edited"
