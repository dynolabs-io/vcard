appId: io.dynolabs.vcard
---
# Edit card + persist after kill. Change name, save, kill, relaunch, assert.
- launchApp:
    stopApp: false
- assertVisible: "Your cards"
- tapOn: "Maestro Tester"
# Edit lives in the navigation header right.
- tapOn: "Edit"
- assertVisible: "Edit Card"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Maestro Tester"
- eraseText: 14
- inputText: "Maestro Edited"
- swipe:
    direction: DOWN
- scrollUntilVisible:
    element: "Save changes"
    direction: DOWN
- tapOn: "Save changes"
- assertVisible: "Maestro Edited"
# Save returns to card detail page. The header title is the card's name
# itself ("Maestro Edited") — navigate back via the Cards tab.
- runFlow:
    when:
      notVisible: "Your cards"
    commands:
      - tapOn: "Cards"
- assertVisible: "Your cards"
- assertVisible: "Maestro Edited"
