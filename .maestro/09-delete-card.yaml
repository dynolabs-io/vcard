appId: io.dynolabs.vcard
---
# Delete card — Apple Contacts pattern: destructive lives inside Edit.
# Tap Edit (header right) → scroll to "Delete card" → confirm.
- launchApp:
    stopApp: false
- tapOn: "Maestro Edited"
- tapOn: "Edit"
- assertVisible: "Edit Card"
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element: "Delete card"
    direction: DOWN
- tapOn: "Delete card"
- assertVisible:
    text: "^Delete$"
- tapOn:
    text: "^Delete$"
- runFlow:
    when:
      notVisible: "Your cards"
    commands:
      - tapOn: "Cards"
- assertVisible: "Your cards"
- assertNotVisible: "Maestro Edited"
