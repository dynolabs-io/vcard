appId: io.dynolabs.vcard
---
# Delete card — uses anchored regex to match the alert button, not the
# page-level "Delete card" text.
- launchApp
- tapOn: "Maestro Edited"
- scrollUntilVisible:
    element: "Delete card"
    direction: DOWN
- tapOn: "Delete card"
- assertVisible:
    text: "^Delete$"
- tapOn:
    text: "^Delete$"
- assertVisible: "Your cards"
- assertNotVisible: "Maestro Edited"
