appId: io.dynolabs.vcard
---
# Photo dialog must only open when tapping the avatar circle / "Add
# photo" hint — NOT when tapping anywhere else in the upper region.
- launchApp:
    stopApp: false
- tapOn: "Maestro Edited"
- tapOn: "Edit"
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    text: "Label"
    optional: true
- assertNotVisible: "Profile photo"
- tapOn:
    text: "Edit Card"
    optional: true
- scrollUntilVisible:
    element: "Save changes"
    direction: DOWN
- tapOn: "Save changes"
- runFlow:
    when:
      notVisible: "Your cards"
    commands:
      - tapOn: "Back"
- assertVisible: "Your cards"
