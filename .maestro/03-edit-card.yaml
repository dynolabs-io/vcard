appId: io.dynolabs.vcard
---
# Open card → Edit → change name → save → verify update.
- launchApp
- assertVisible: "Your cards"
- tapOn: "Maestro Tester"
- scrollUntilVisible:
    element: "Edit"
    direction: DOWN
- tapOn: "Edit"
- assertVisible: "Edit Card"
- tapOn:
    text: "Maestro Tester"
- eraseText: 14
- inputText: "Maestro Edited"
- hideKeyboard
- scrollUntilVisible:
    element: "Save changes"
    direction: DOWN
- tapOn: "Save changes"
- assertVisible: "Maestro Edited"
