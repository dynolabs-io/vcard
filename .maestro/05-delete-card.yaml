appId: io.dynolabs.vcard
---
# Open card → Delete → confirm → verify removed.
- launchApp
- tapOn: "Maestro Edited"
- scrollUntilVisible:
    element: "Delete card"
- tapOn: "Delete card"
- assertVisible:
    text: "Delete"
- tapOn:
    text: "Delete"
    index: 1
- assertVisible: "Your cards"
- assertNotVisible: "Maestro Edited"
