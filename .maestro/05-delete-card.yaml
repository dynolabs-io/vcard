appId: io.dynolabs.vcard
---
# Open card → Delete → confirm → verify removed.
- launchApp
- tapOn: "Maestro Edited"
- scrollUntilVisible:
    element: "Delete card"
    direction: DOWN
- tapOn: "Delete card"
# Confirm-Alert. Match the destructive "Delete" button exactly (^Delete$)
# so we don't catch the page-level "Delete card" button still visible
# behind the alert.
- assertVisible:
    text: "^Delete$"
- tapOn:
    text: "^Delete$"
- assertVisible: "Your cards"
- assertNotVisible: "Maestro Edited"
