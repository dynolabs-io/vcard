appId: io.dynolabs.vcard
---
# Open card → Delete → confirm → verify removed.
- launchApp
- tapOn: "Maestro Edited"
- scrollUntilVisible:
    element: "Delete card"
- tapOn: "Delete card"
- assertVisible:
    text: "Delete"
- tapOn:
    text: "Delete"
    index: 1   # second "Delete" — the destructive action button (first is the dialog title)
- assertVisible: "Cards"
- assertNotVisible: "Maestro Edited"
