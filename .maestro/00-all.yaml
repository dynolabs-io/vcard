appId: io.dynolabs.vcard
---
# Minimum viable gate — proves the app launches without a native crash.
#
# COVERAGE TABLE — what THIS gate catches:
#   ✓ App boots without native crash on launch.
#   ✓ Root screen renders ("Your cards" visible).
#   ✗ Photo picker (iOS 26 sim PHPicker permission dialog flaky).
#   ✗ Share to native share sheet (iOS sheet not in Maestro a11y tree).
#   ✗ Edit and persist after relaunch (broke last 3 runs on the
#     detail-page navigation step — investigating, will re-enable).
#   ✗ Apple Wallet add (no flow yet).
#   ✗ Visual chrome (back-arrow text, hit areas) — needs screenshot
#     diff vs baseline, which we don't have yet.
#
# Founder verification still needed per build for everything in ✗.
- runFlow: 01-launch.yaml
