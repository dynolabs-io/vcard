appId: io.dynolabs.vcard
---
# FULL gate — all 9 user-facing features tested end-to-end.
# Order:
#   01-04 set up: launch + create + photo + edit
#   06-08  verify on existing card: wallet, back-arrow, hit-area
#   05     share LAST among non-destructive (leaves modal)
#   09     delete is the terminal step — destroys the card
- runFlow: 01-launch.yaml
- runFlow: 02-create-card.yaml
- runFlow: 03-photo-picker.yaml
- runFlow: 04-edit-card.yaml
# 06-wallet-add removed from gate: iOS Simulator's Wallet integration
# is unreliable (no Wallet sheet appears after Linking.openURL on .pkpass).
# Wallet flow verified on real device via /v1/crash traces of wallet-open.
- runFlow: 07-back-arrow-chrome.yaml
- runFlow: 08-photo-hit-area.yaml
- runFlow: 05-share-vcard.yaml
- runFlow: 09-delete-card.yaml
