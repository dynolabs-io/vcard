appId: io.dynolabs.vcard
---
# Share as vCard. Tap Share icon → Share as vCard. Success = iOS share
# sheet appears (UIActivityViewController).
- launchApp:
    stopApp: false
- runFlow:
    when:
      notVisible: "Maestro Edited"
    commands:
      - assertVisible: "Your cards"
- tapOn: "Maestro Edited"
- tapOn: "Share"
- assertVisible: "Share as vCard"
- tapOn: "Share as vCard"
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: "Share failed"
# Dismiss the share sheet (button text varies between iOS versions)
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Copy"
    commands:
      - tapOn: "Copy"
- waitForAnimationToEnd:
    timeout: 3000
# Navigate back to cards list so subsequent flows (09-delete) have a
# known starting state. The bottom Cards tab is the reliable fallback
# when the iOS 26 back chevron is missing from the a11y tree.
- runFlow:
    when:
      notVisible: "Your cards"
    commands:
      - tapOn:
          id: "card-back"
- assertVisible: "Your cards"
