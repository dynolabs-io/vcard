appId: io.dynolabs.vcard
---
# Share as vCard. The crash happens INSIDE Share-as-vCard's onPress
# (calling expo-sharing). Tapping it for real surfaces the crash.
# Success = iOS share sheet appears (UIActivityViewController).
- launchApp:
    stopApp: false
- runFlow:
    when:
      notVisible: "Maestro Edited"
    commands:
      - assertVisible: "Your cards"
- tapOn: "Maestro Edited"
- scrollUntilVisible:
    element: "Share"
    direction: DOWN
- tapOn: "Share"
- assertVisible: "Share as vCard"
- tapOn: "Share as vCard"
# The native iOS share sheet must appear. We don't know which targets
# the simulator has installed, so we assert presence of either common
# elements OR our error Alert if shareVCard threw. The error Alert
# would fail the flow.
- waitForAnimationToEnd:
    timeout: 10000
- assertNotVisible: "Share failed"
# Dismiss the share sheet (button text varies between iOS versions)
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
# iOS share sheet doesn't expose Cancel/Close. "Copy" is always present
# and dismisses the sheet without launching another app — clean exit.
- runFlow:
    when:
      visible: "Copy"
    commands:
      - tapOn: "Copy"
- waitForAnimationToEnd:
    timeout: 3000
# Navigate back to cards list so subsequent flows (09-delete) have a
# known starting state.
- runFlow:
    when:
      visible: "Back"
    commands:
      - tapOn: "Back"
- assertVisible: "Your cards"
