appId: io.dynolabs.vcard
---
# Back arrow chrome — never show "(tabs)" as the back button label.
- launchApp:
    stopApp: false
- tapOn: "Maestro Edited"
# The Stack.Screen sets headerBackButtonDisplayMode='minimal' so the
# back button shows only a chevron, AND headerBackTitle='Back' so the
# accessibility label is "Back" not "(tabs)". The whole point: VoiceOver
# users shouldn't hear "(tabs)", and Maestro's a11y-tree-based
# visibility must also not see "(tabs)".
- assertNotVisible: "(tabs)"
- assertVisible: "Card"  # the route title — proves we ARE on detail
