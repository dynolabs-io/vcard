appId: io.dynolabs.vcard
---
# Back arrow chrome — never show "(tabs)" as the back button label.
- launchApp
- tapOn: "Maestro Edited"
# We're on the card detail page; the back arrow is at top-left.
# The Stack.Screen options set headerBackButtonDisplayMode='minimal'
# AND headerBackTitle=''. So "(tabs)" must NOT appear in the chrome.
- assertNotVisible: "(tabs)"
