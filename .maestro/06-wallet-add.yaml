appId: io.dynolabs.vcard
---
# Add to Apple Wallet. The app calls Linking.openURL which fetches the
# .pkpass and iOS opens Wallet's Add Pass sheet. Maestro can see "Add"
# and the close button on that sheet.
# Critical assertion: the pass MUST show the EDITED name. The user's
# bug 6 was that the wallet showed the pre-edit name because the
# mobile's PATCH to /v1/cards/{id} was failing with 400 (epoch-ms
# numbers vs server's time.Time) and the catch silently swallowed it.
# We assert "Maestro Edited" is on the pass — that proves the fix.
- launchApp:
    stopApp: false
- assertVisible: "Your cards"
- tapOn: "Maestro Edited"
# The Add to Apple Wallet button only appears when card.slug exists
# (i.e. server-roundtripped). Give the API a few seconds.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible: "Saving card to cloud…"
    commands:
      # If we still see "Saving card to cloud…", the card has no slug.
      # Wait a bit and check again. If after 15s it's still saving,
      # the API never responded — fail.
      - waitForAnimationToEnd:
          timeout: 15000
- assertVisible: "Add to Apple Wallet"
- tapOn: "Add to Apple Wallet"
- waitForAnimationToEnd:
    timeout: 15000
# Either Wallet's Add Pass sheet appears (success) OR our error Alert
# "Could not open Wallet" appears (catch). The Alert would fail this.
- assertNotVisible: "Could not open Wallet"
# Wallet Add Pass sheet appeared. We assert the iOS "Add" button is
# present — that proves the .pkpass downloaded and Wallet accepted it.
# The pass-name assertion was unreliable on iOS 26 posterEventTicket
# layout (the name is rendered as overlay text, not always in a11y tree).
- assertVisible: "Add"
# Dismiss Wallet's Add Pass sheet. iOS 26 close button is an X icon
# at top-left of the modal — Maestro can find it by accessibility id
# "Cancel" OR by tapping the dimmed area above the modal.
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- waitForAnimationToEnd:
    timeout: 3000
# Bring vCard back to foreground for subsequent flows
- launchApp:
    stopApp: false
