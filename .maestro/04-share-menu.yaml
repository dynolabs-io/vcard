appId: io.dynolabs.vcard
---
# Share menu — tap "Share as vCard" for REAL, wait for the iOS share
# sheet, then dismiss.
- launchApp
- tapOn: "Maestro Edited"
- tapOn: "Share"
- assertVisible: "Share as vCard"
- tapOn: "Share as vCard"
- waitForAnimationToEnd:
    timeout: 8000
- runFlow:
    when:
      visible: "Share failed"
    commands:
      - assertVisible: "this-string-does-not-exist-fail-the-flow"
- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn: "Cancel"
