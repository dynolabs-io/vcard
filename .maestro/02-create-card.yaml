appId: io.dynolabs.vcard
---
# Tap "Create card" CTA, fill name, save, verify card appears.
- clearState
- launchApp
- assertVisible: "Your cards"
- tapOn: "Create card"
- assertVisible: "Save card"
- tapOn:
    text: "Your name"
    optional: true
- inputText: "Maestro Tester"
- hideKeyboard
- scrollUntilVisible:
    element: "Save card"
- tapOn: "Save card"
- assertVisible: "Maestro Tester"
