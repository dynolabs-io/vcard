              - link [ref=e711] [cursor=pointer]:
                - /url: https://www.linkedin.com/posts/uc-san-diego-school-of-computing-information-and-data-sciences_rajesh-gupta-a-distinguished-computer-scientist-activity-7349224373087522819-zNh7?trk=public_profile_relatedPosts
                - generic [ref=e712]:
                  - heading [level=3]
                  - paragraph [ref=e713]: "Rajesh Gupta, a distinguished computer scientist and seasoned academic leader, has been named founding dean of the UC San Diego School of Computing, Information and Data Sciences, effective July 1, 2025. Gupta brings a wealth of academic and administrative talent to leading SCIDS. Gupta’s continued leadership will be instrumental in shaping the future of SCIDS, which leverages the existing strengths of HDSI and the San Diego Supercomputer Center (SDSC) — a national center that has, for four decades, led and enabled data and computationally intensive scientific breakthroughs. Trained as a circuit designer, Gupta led the Computer Science and Engineering department, several center-scale efforts sponsored by the NSF and the Defense Advanced Research Projects Agency (DARPA). A distinguished alumnus of IIT Kanpur, Gupta received a Master’s Degree in electrical engineering and computer sciences from UC Berkeley, and a PhD in electrical engineering from Stanford University. Gupta held the INRIA International Chair at the French international research institute in Rennes, Bretagne Atlantique. He is a fellow of the Institute of Electrical and Electronics Engineers (IEEE), the Association for Computing Machinery (ACM), and the American Association for the Advancement of Science (AAAS). “As founding director of the Halıcıoğlu Data Science Institute (HDSI), Rajesh has played a pivotal role in shaping our university's interdisciplinary, data-driven research landscape. Under his guidance, SCIDS will contribute to UC San Diego's reputation as a leading university, building on our legacy of strength and innovation in high-performance computing, data science and artificial intelligence.” - Chancellor Pradeep K. Khosla. Read more here: https://ow.ly/E5CI50Wo5Lk"
