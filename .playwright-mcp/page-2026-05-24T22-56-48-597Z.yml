                - generic [ref=e695]:
                  - heading [level=3]
                  - paragraph [ref=e696]: "Five UC Berkeley students — all from the graduate program in computer science — were honored as Siebel Scholars Foundation's class of 2026! \"This scholarship will allow them to pursue new research directions to advance knowledge and innovation in their fields,\" said Mark Asta, interim dean and Roy W. Carlson Professor of Engineering at Berkeley. Meet the 2026 class of Siebel Scholars at Berkeley: * Shai Dickman is exploring Al-driven approaches to generate amino acid sequences that produce proteins with desirable structures and properties. * Leon Kornfeld is working on innovative research in computer vision and robotics. * Kanav Mittal is studying Al risk and alignment in educational settings. * Ronit Nagarapu is researching methods to optimize performance on hardware accelerators for machine learning applications. * Alp Eren Ozdarendeli is examining the security vulnerabilities of sophisticated Al systems and developing defense architectures to guard against adversarial attacks. Read our story: bit.ly/4n9yvCl"
